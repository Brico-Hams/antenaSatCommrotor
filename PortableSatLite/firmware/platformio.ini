; PortableSatLite rotor controller - ESP32 (any ESP32-DevKitC / WROOM-32 class board). NOT compiled in the authoring environment (no PlatformIO there):
; the hardware-independent core (lib/satcore) IS compiled and tested on the host - see tests/ and docs/TESTING.md.
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    https://github.com/Hopperpop/Sgp4-Library.git#master   ; MIT, validated vs python-sgp4 (tests/test_sgp4_lib.py)
    gin66/FastAccelStepper@^0.31.0                          ; MIT, hardware pulse generation (RMT/MCPWM) - no jitter from WiFi
    mikalhart/TinyGPSPlus@^1.0.3                            ; LGPL-2.1
build_flags = -DCORE_DEBUG_LEVEL=0 -Uunix
