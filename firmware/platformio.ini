[platformio]
default_envs = esp32
data_dir = ../web
test_dir = ../tests/control_logic

[env:esp32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -D ARDUINOJSON_USE_DOUBLE=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
  https://github.com/Hopperpop/Sgp4-Library.git#7c82d31f9d9a286acde5ef55da8308fc93d2ba96
  bblanchon/ArduinoJson@6.21.5
  mikalhart/TinyGPSPlus@1.1.0
  h2zero/NimBLE-Arduino@1.4.3

[env:control_native]
platform = native@1.2.1
test_filter = test_native
build_flags = -std=c++11
test_build_src = no

; Low-cost profile: reuse owned NEMA17 (17HS8401 on EL, 17HS3401 on AZ) with
; TMC2209 at 1/8 microstep (StealthChop interpolates to 256). Same 25:1 belts.
; 40000 usteps/rev, 6.0 deg/s maximum for high-elevation LEO passes.
[env:esp32_nema17]
extends = env:esp32
build_flags =
  ${env:esp32.build_flags}
  -D ROTOR_MICROSTEPS=8
  -D ROTOR_MAX_RATE_STEPS=660.0
  -D ROTOR_ACCELERATION_STEPS=450.0
