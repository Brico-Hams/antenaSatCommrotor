<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">BricoHams: previo solo RX y bypass TX interbloqueado</title>
<desc id="desc">Diagrama funcional de una banda. PA y filtro en ruta TX; preselector, aislamiento, LNA y proteccion en RX. Confirmacion fisica de rutas antes de PTT. No es esquema por pines.</desc>
<rect width="1200" height="800" fill="#f4f7fa"/><rect width="1200" height="95" fill="#16324a"/>
<g font-family="sans-serif" fill="white"><text x="30" y="43" font-size="27">BricoHams | Un kit por banda: RX protegido / TX separado</text><text x="30" y="78" font-size="18">Aplicable a PF-01, Eggbeater y QFH | Techo solicitado 25 W, NO CUALIFICADO</text></g>
<g fill="white" stroke="#16324a" stroke-width="2"><rect x="30" y="180" width="130" height="75"/><rect x="215" y="180" width="160" height="75"/><rect x="430" y="180" width="160" height="75"/><rect x="820" y="285" width="140" height="85"/><rect x="1010" y="285" width="160" height="85"/><rect x="30" y="395" width="130" height="75"/><rect x="215" y="395" width="160" height="75"/><rect x="430" y="395" width="160" height="75"/><rect x="645" y="395" width="120" height="75"/><rect x="30" y="530" width="1140" height="135" rx="10"/></g>
<g fill="none" stroke="#e8871e" stroke-width="5"><path d="M160 217h55m160 0h55m160 0h155v95h75m140 15h50"/></g>
<g fill="none" stroke="#326488" stroke-width="5"><path d="M820 345h-25v87h-30m-120 0h-55m-160 0h-55m-160 0h-55"/></g>
<g fill="none" stroke="#628a7d" stroke-width="2" stroke-dasharray="8 5"><path d="M295 530v-60m410 60v-60m185 60V370m-595 160V255"/></g>
<g font-family="sans-serif" font-size="20" fill="#16324a" text-anchor="middle"><text x="95" y="224">SDR TX</text><text x="295" y="224">PA + limite</text><text x="510" y="224">Filtro salida</text><text x="890" y="320">S1 RF</text><text x="890" y="350">TX / RX</text><text x="1090" y="335">ANTENA</text><text x="95" y="439">SDR RX</text><text x="295" y="439">Proteccion</text><text x="510" y="439">LNA RX</text><text x="705" y="425">S2 + filtro</text><text x="705" y="452" font-size="15">aislar/terminar</text></g>
<g font-family="sans-serif" fill="#16324a"><text x="50" y="565" font-size="22" font-weight="bold">Secuenciador hardware: retorno real + watchdog + PA inhibido ante fallo</text><text x="50" y="602" font-size="19">TX: quitar drive → aislar/apagar LNA → conmutar en frio → confirmar → permitir PTT</text><text x="50" y="640" font-size="19">RX: inhibir PA → confirmar RF extinguida → conmutar → confirmar RX → restaurar LNA</text><text x="30" y="705" font-size="17">No es pinout. Medir tambien fuga hacia el LNA de la OTRA banda durante TX/RX simultaneo.</text></g>
<rect y="730" width="1200" height="70" fill="#16324a"/><g font-family="sans-serif" font-size="16" fill="white"><text x="30" y="759">Anatol EA5KAO · Diego EA5JEF · Pedro Roca Molina | bricohams.org</text><text x="30" y="786">HOLD: componentes, tiempos, aislamiento y disipacion pendientes de seleccion y banco.</text></g>
</svg>
