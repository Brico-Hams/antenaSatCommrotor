name: Native Android BLE
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'tests/android/**', 'firmware/include/ble_protocol.h', 'firmware/include/control_logic.h', 'firmware/src/main.cpp', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tests/android/**', 'firmware/include/ble_protocol.h', 'firmware/include/control_logic.h', 'firmware/src/main.cpp', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/android/.tools/android-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package (the action's default) no longer exists.
          packages: 'platform-tools'
      - name: Install exact SDK platform and tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify wrapper
        working-directory: android
        run: |
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          chmod +x gradlew
      - name: Unit tests, lint and debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: PortableSatStation-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-and-lint-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
